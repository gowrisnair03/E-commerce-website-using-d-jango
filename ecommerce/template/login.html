<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Shop Login</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e7ebe6, #a8e063);
        }

        .container{
            width: 400px;
            background: #fff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #2e7d32;
        }

        .fruit-icon{
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
        }

        input:focus{
            border-color: #4caf50;
            box-shadow: 0 0 8px rgba(76,175,80,0.3);
        }

        button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #43a047;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background: #2e7d32;
        }

        .register-link{
            text-align: center;
            margin-top: 15px;
        }

        .register-link a{
            text-decoration: none;
            color: #2e7d32;
            font-weight: bold;
        }

        .register-link a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="fruit-icon">🍎</div>

        <h2>Fruit Shop Login</h2>

        <form method="POST">
            {% csrf_token %}

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <div class="register-link">
            <p>
                Don't have an account?
                <a href="{% url 'register' %}">Register Here</a>
            </p>
        </div>

    </div>

</body>
</html>
